<style>

nav button{border-color:var(--line)}
nav button[aria-current="true"]{background:var(--ch);color:#fff;border-color:var(--ch)}

.date{color:var(--ch)}
dl{border:0;border-left:5px solid var(--ch);background:color-mix(in srgb,var(--ch) 12%,transparent)}

.pn button{background:var(--ch);color:#fff}
.bar span:nth-child(1){background:#b5502b;color:#fff}.bar span:nth-child(2){background:#2f7d6d;color:#fff}.bar span:nth-child(3){background:#3e6fa8;color:#fff}.bar span:nth-child(4){background:#7a8f2e;color:#fff}
.bar{border-radius:4px;overflow:hidden}
.ban{margin:-1.6rem -1.4rem 1.3rem;padding:1.5rem 1.4rem;font-size:3rem;letter-spacing:.5rem;line-height:1;background:linear-gradient(120deg,var(--ch),color-mix(in srgb,var(--ch) 40%,#1e1610));text-shadow:0 4px 12px rgba(0,0,0,.4)}
.date{font-family:Caveat,"Segoe Script","Bradley Hand",cursive;font-size:1.65rem;line-height:1.2;margin-bottom:.2rem}

article{box-shadow:8px 8px 0 color-mix(in srgb,var(--ch) 35%,transparent)}
nav{background-image:linear-gradient(var(--pc,#8a3b1f),var(--pc,#8a3b1f));background-repeat:no-repeat;background-size:var(--p,0%) 4px;background-position:left bottom;transition:background-size .5s}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}

.strata i:nth-child(2){animation-delay:.1s}.strata i:nth-child(3){animation-delay:.2s}.strata i:nth-child(4){animation-delay:.3s}.strata i:nth-child(5){animation-delay:.4s}.strata i:nth-child(6){animation-delay:.5s}.strata i:nth-child(7){animation-delay:.6s}

body{font-size:19px}
main,footer{max-width:860px}.hero .in{max-width:860px}
.hero{background:radial-gradient(ellipse at 80% 0,#6a3318 0,transparent 55%),#1e1610}

.date,.qc b{color:color-mix(in srgb,var(--ch) 70%,var(--ink))}
.qs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.75rem;margin:1.4rem 0}
.qc{padding:.8rem .95rem;border-radius:10px;border-top:4px solid var(--ch);background:color-mix(in srgb,var(--ch) 12%,transparent);font-size:.93rem;line-height:1.5}
.qc:last-child{grid-column:1/-1}
.qc b{display:block;font-family:Fraunces,Georgia,serif;margin-bottom:.2rem}
.cause{border-radius:0 10px 10px 0}
.pn button{border-radius:99px;padding:.6rem 1.3rem}
h3{font-family:Fraunces,Georgia,serif}
html{scroll-behavior:smooth}
article{margin-bottom:2.4rem;scroll-margin-top:4.2rem}
nav a{font-size:.9rem;color:var(--ink);padding:.35rem .85rem;border:1px solid var(--line);border-radius:99px;text-decoration:none;display:inline-block}
nav a[aria-current="true"]{background:var(--ch);color:#fff;border-color:var(--ch)}
.pn a{background:var(--ch);color:#fff;border-radius:99px;padding:.6rem 1.3rem;text-decoration:none}

article{display:none}
article.on{display:block}

<body>
<header class="hero"><div class="in"><p class="kick">The field journal of a time traveler</p><h1>Through Deep Time</h1><p class="sub">One planet. Billions of years. Countless changes in life.</p><div class="chips"><b>4.54 Ga of history</b><b>6 chapters</b><b>4 mass extinctions</b></div></div><div class="strata" aria-hidden="true"><i style="background:#8a6d3b"></i><i style="background:#b5502b"></i><i style="background:#2f7d6d"></i><i style="background:#3e6fa8"></i><i style="background:#7a8f2e"></i><i style="background:#7b4a8c"></i><i style="background:#6b5b4a"></i></div></header>
<nav id="nav" aria-label="Chapters"></nav>
<main id="main"></main>
<footer>General Biology 2 · Digital Storytelling Project · Story website</footer>

<script>
document.documentElement.className="js";var S=[
{n:"Opening",date:"Journal entry 0 · Departure",t:"Why I’m leaving the present",
j:["I am a time traveler, and this is my field journal. My machine has one rule: I can only travel forward, from the oldest moment I can reach to the newest. So my first stop is the birth of Earth, and my last stop is today.","Along the way I will not just list dates and animals. I want to find out how changing environments, evolution, and extinction shaped the living world I came from. Each entry answers five questions: When are we? What is Earth like? What life is here? What changes? Why does it matter?"],
x:'<h3>My route (NOT TO SCALE)</h3><div class="bar" role="img" aria-label="Unequal timeline of the four time divisions"><span style="flex:8">Precambrian 4.54 Ga to 538.8 Ma</span><span style="flex:2">Paleozoic</span><span style="flex:1.4">Meso.</span><span style="flex:1">Ceno.</span></div><p class="small">NOT TO SCALE. The Precambrian is about 88% of Earth’s history, so it would fill almost the whole bar if drawn to scale. Ga = billion years ago. Ma = million years ago.</p><p>Key terms: an <b>eon</b> is the largest slice of geologic time and an <b>era</b> is a slice inside an eon. The Precambrian is not one unit. It is three eons: Hadean, Archean, and Proterozoic.</p>'},
{n:"Precambrian",date:"Journal entry 1 · 4.54 Ga to 538.8 Ma (Hadean, Archean, Proterozoic eons)",t:"Chapter 1: A world without animals",
j:["The ground is hot and ugly. Hadean Earth (4.54 to 4.0 Ga) is battered by space rocks, and there is no air I can breathe. Later, in the Archean (4.0 to 2.5 Ga), I find shallow seas holding mats of tiny microbes. Their layered rock mounds, called stromatolites, are among the oldest signs of life, dating to about 3.5 Ga.","Then I notice bubbles. Some microbes make food from sunlight and release oxygen as waste. For a long time the oxygen is soaked up by iron in the oceans. Around 2.4 Ga it finally spills into the air, in the Great Oxidation Event. In the Proterozoic, cells with a nucleus (eukaryotes) appear by about 1.8 to 1.6 Ga. Near the end, around 575 to 539 Ma, I see the soft, flat Ediacaran organisms, some of the first large multicellular life."],
q:["4.54 Ga to 538.8 Ma. Hadean, Archean, and Proterozoic eons.","Starts hot and rocky. Oceans form. The air has almost no free oxygen until about 2.4 Ga. Ice ages happen late in the Proterozoic.","Bacteria, archaea, stromatolite builders, eukaryotes, then Ediacaran organisms.","Oxygen builds up. Many oxygen-hating microbes lose their habitats.","Oxygen and cells with nuclei made complex life possible."],
e:["First life: microbes, about 3.5 Ga or earlier","Photosynthesis releases oxygen, followed by the Great Oxidation Event, about 2.4 Ga","Eukaryotic cells appear, about 1.8 to 1.6 Ga","Multicellular Ediacaran life, about 575 to 539 Ma"],
c:"Cause → effect: Photosynthetic microbes released oxygen → oxygen rose in the oceans and air → oxygen-using life, including eukaryotes and later animals, could evolve."},
{n:"Paleozoic",date:"Journal entry 2 · 538.8 to 251.9 Ma (Paleozoic Era)",t:"Chapter 2: Animals explode, then move onto land",
j:["My machine lands in a warm sea and I almost drop my notebook. The water is full of animals with shells, eyes, and legs. In about 15 to 20 million years starting near 538 Ma, the main animal body plans appear. Scientists call this the Cambrian explosion. Trilobites crawl past my boots.","Later I walk on land that was empty before. Plants colonized it about 470 Ma, and their roots began building soil. By about 375 Ma, fish with limbs like Tiktaalik are moving toward shallow water and the first four-legged animals follow. By about 315 Ma, animals lay eggs with a protective membrane, called amniotic eggs, so they can breed far from water. The coal forests of the Carboniferous are huge and humid.","But this age has a dark side. About 445 Ma, glaciers grow and seas drop, and many marine species vanish. Another crisis hits near 372 Ma. Then, at 251.9 Ma, I see the worst day in all my travels: the end-Permian mass extinction, nicknamed the Great Dying. Roughly 80 to 95% of marine species disappear, and many land species too. The cause is huge volcanic eruptions in Siberia (the Siberian Traps). They pumped out carbon dioxide, which warmed the planet and left oceans low in oxygen."],
q:["538.8 to 251.9 Ma. Paleozoic Era.","Warm seas at first, then ice ages, then hot and dry Pangaea. Land plants and forests spread.","Trilobites, early fish, land plants, tetrapods, insects, early reptiles.","Two major mass extinctions: Late Ordovician (about 445 Ma) and end-Permian (251.9 Ma).","Land ecosystems, soil, and the vertebrate body plan began here. The Great Dying cleared space for new groups."],
e:["Cambrian explosion, from about 538 Ma","First land plants, about 470 Ma","First tetrapods (four-limbed animals), about 375 Ma","Amniotic egg evolves, about 315 Ma","MASS EXTINCTION: Late Ordovician, about 445 Ma (glaciation and falling sea level)","MASS EXTINCTION: end-Permian, 251.9 Ma (Siberian Traps volcanism)"],
c:"Cause → effect: Siberian Traps eruptions released CO₂ → global warming and oceans with little oxygen → about 90% of marine species died → survivors, like early dinosaur relatives, could spread into empty niches."},
{n:"Mesozoic",date:"Journal entry 3 · 251.9 to 66 Ma (Mesozoic Era)",t:"Chapter 3: The age of reptiles",
j:["The world I step into is bare and recovering. At first the supercontinent Pangaea is hot, and reptiles do well. By about 230 Ma, the first dinosaurs run through the scrub. Tiny, furry mammals appear around the same time, hiding in the shadows and mostly active at night.","Near 201 Ma, I watch another extinction, the end-Triassic. Volcanic eruptions as Pangaea split apart changed the climate, and many large reptile rivals of the dinosaurs died. This leaves dinosaurs as the top land animals in the Jurassic. About 150 Ma I see feathered Archaeopteryx glide between trees, showing that birds descend from dinosaurs. Around 130 Ma, the first flowering plants open, and insects and flowers begin to shape each other’s evolution.","The last scene is the hardest to watch. At 66 Ma, an asteroid about 10 km wide hits what is now Mexico (Chicxulub). Dust and soot block sunlight, plants fail, and food chains collapse. Non-bird dinosaurs, marine reptiles, and about three quarters of all species disappear."],
q:["251.9 to 66 Ma. Triassic, Jurassic, and Cretaceous periods.","Pangaea breaks into continents. Climate is warm, and sea levels are high.","Dinosaurs, early mammals, pterosaurs, birds, flowering plants, and insects.","End-Triassic extinction (about 201 Ma) and end-Cretaceous extinction (66 Ma).","Birds are living dinosaurs. Mammals survived by being small, and flowers changed land ecosystems."],
e:["First dinosaurs and first mammals, about 230 Ma","First birds (Archaeopteryx), about 150 Ma","First flowering plants, about 130 Ma","MASS EXTINCTION: end-Triassic, about 201 Ma (volcanism as Pangaea split)","MASS EXTINCTION: end-Cretaceous (K-Pg), 66 Ma (asteroid impact)"],
c:"Cause → effect: An asteroid struck at 66 Ma → dust blocked sunlight and food chains collapsed → non-bird dinosaurs went extinct → mammals gained open niches and diversified."},
{n:"Cenozoic",date:"Journal entry 4 · 66 Ma to today (Cenozoic Era)",t:"Chapter 4: The rise of mammals",
j:["The crater is still smoking when I arrive. In the first few million years, ferns spread back and small mammals start to grow bigger. Within about 10 million years there are early whales’ ancestors, bats, and primates. Forests dominate until the world cools. Starting about 25 to 20 Ma, grasslands expand, and grazing animals like horses evolve long legs and tough teeth.","In the last 2.6 million years, ice ages come and go, and I can see mammoths on cold plains. Modern humans, Homo sapiens, appear in Africa about 300,000 years ago (0.3 Ma). That is the blink at the end of my trip, yet humans now change climates and habitats faster than almost any species before."],
q:["66 Ma to today. Paleogene, Neogene, and Quaternary periods.","Earth cools overall. Ice sheets form, and grasslands spread.","Mammals, birds, flowering plants, grasses, primates, and humans.","A sixth mass extinction may now be underway, driven by human activity (Barnosky et al., 2011).","This is the world that shaped us, and the one we are changing."],
e:["Mammals diversify after the K-Pg extinction, from 66 Ma","Grasslands spread and grazers evolve, from about 25 to 20 Ma","Homo sapiens appears, about 0.3 Ma (300,000 years ago)"],
c:"Cause → effect: Global cooling and drying → forests shrank and grasslands grew → grazing mammals with long legs and tough teeth evolved."},
{n:"Ending",date:"Journal entry 5 · Back to the present",t:"Ending: How did deep time shape biodiversity today?",
j:["I step out of the machine and the world looks different. Every living thing around me is a survivor of a very long story.","Here is what my journal taught me. First, <b>environment changes life</b>. Oxygen, warming, ice, and falling seas decided which species could survive. Second, <b>evolution fills empty niches</b>. After each extinction, surviving groups diversified: reptiles after the Permian, dinosaurs after the Triassic, and mammals after the Cretaceous. Third, <b>extinction resets the game</b>. As conditions changed, some groups disappeared while others diversified into empty niches.","Biodiversity today, from the birds in my yard (dinosaur descendants) to the grasses, flowers, and people, exists because life survived at least five major mass extinctions and kept branching. Deep time also warns me: recovery after mass extinctions took millions of years. If we cause extinctions now, nature will not bounce back on a human timescale. Deep time shaped biodiversity today, and what we do next is the newest entry."],
x:'<h3>Quick recap of the required checks</h3><ul><li>All six chapters in order: Opening, Precambrian, Paleozoic, Mesozoic, Cenozoic, Ending.</li><li>14 biological events and 4 mass extinctions (Ordovician, Permian, Triassic, Cretaceous), and 4 cause-and-effect links.</li><li>Important: life does not climb a “ladder” toward humans. It branches like a tree.</li></ul>'},
{n:"References",date:"Sources and credits",t:"References and project notes",
x:'<h3>Credible sources</h3><ol class="ref"><li>International Commission on Stratigraphy. <i>International Chronostratigraphic Chart</i> (latest version). stratigraphy.org.</li><li>Knoll, A. H. (2003). <i>Life on a Young Planet: The First Three Billion Years of Evolution on Earth.</i> Princeton University Press.</li><li>Lyons, T. W., Reinhard, C. T., &amp; Planavsky, N. J. (2014). The rise of oxygen in Earth’s early ocean and atmosphere. <i>Nature, 506</i>, 307–315.</li><li>Benton, M. J. (2015). <i>When Life Nearly Died: The Greatest Mass Extinction of All Time</i> (2nd ed.). Thames &amp; Hudson.</li><li>Schulte, P., et al. (2010). The Chicxulub asteroid impact and mass extinction at the Cretaceous-Paleogene boundary. <i>Science, 327</i>, 1214–1218.</li><li>Barnosky, A. D., et al. (2011). Has the Earth’s sixth mass extinction already arrived? <i>Nature, 471</i>, 51–57.</li></ol><p class="small">Dates are rounded and can shift sl
